<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Hive Planner</title>

<meta name="theme-color" content="#070806" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Hive Planner" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
  :root { --bg:#061a20; --panel:rgba(5,25,29,.91); --line:rgba(62,224,202,.72); --text:#effffb; --muted:#a8d8d0; --accent:#42dccb; --danger:#ff8b38; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  input, textarea { user-select:text; -webkit-user-select:text; }
  #canvas { width:100vw; height:100vh; display:block; touch-action:none; background:linear-gradient(135deg,#0b2638 0%,#103b3d 48%,#1b4035 100%); }
  .bar { position:fixed; left:8px; right:8px; z-index:10; display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:7px; border:1px solid rgba(66,220,203,.28); background:var(--panel); backdrop-filter:blur(12px); border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.45); }
  #top { top:max(8px, env(safe-area-inset-top)); }
  #bottom { bottom:max(8px, env(safe-area-inset-bottom)); align-items:center; }
  #rectPanel, #iconPanel {
    position:fixed; left:8px; top:var(--tool-tray-top, 62px); z-index:30;
    width:min(380px, calc(100vw - 16px)); box-sizing:border-box;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px;
    overflow:auto; padding:0;
    max-height:0; opacity:0; visibility:hidden; pointer-events:none;
    border:1px solid rgba(66,220,203,0); background:rgba(4,8,18,.94);
    backdrop-filter:blur(14px); border-radius:14px; box-shadow:0 12px 34px rgba(0,0,0,.45);
    transform:translateY(-6px) scale(.985); transform-origin:top left;
    transition:max-height .18s ease, opacity .14s ease, transform .18s ease, padding .18s ease, border-color .18s ease;
  }
  #rectPanel.show, #iconPanel.show {
    max-height:min(360px, calc(100vh - var(--tool-tray-top, 62px) - 90px));
    opacity:1; visibility:visible; pointer-events:auto; padding:8px;
    border-color:rgba(66,220,203,.26); transform:translateY(0) scale(1);
  }
  .iconTool, .rectTool { min-width:100px; max-width:100px; padding:8px; display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:flex-start; text-align:center; font-size:12px; line-height:1.15; }
  .iconTool img { width:52px; height:52px; object-fit:contain; pointer-events:none; }
  .rectSwatch { width:52px; height:34px; border-radius:8px; border:2px solid rgba(255,255,255,.85); box-sizing:border-box; }
  .rectSwatch.blue { background:rgba(70,190,255,.42); border-color:rgba(110,220,255,.95); }
  .rectSwatch.green { background:rgba(110,255,140,.34); border-color:rgba(170,255,180,.98); }
  .rectSwatch.red { background:rgba(255,90,90,.32); border-color:rgba(255,145,145,.98); }
  .rectSwatch.yellow { background:rgba(255,215,70,.34); border-color:rgba(255,240,150,.98); }
  .rectSwatch.outline { background:transparent; border-color:rgba(245,245,245,.98); }
  button, input, textarea { font:inherit; }
  button { color:var(--text); background:rgba(255,255,255,.08); border:1px solid rgba(66,180,165,.24); border-radius:11px; padding:9px 10px; min-height:38px; }
  #castlePlacementSubmenu { border-top:1px solid rgba(66,220,203,.25); padding:10px 2px 2px; margin-top:4px; gap:8px; align-items:center; flex-wrap:wrap; }
  #iconPlacementTitle { font-size:12px; color:#b9d8d4; line-height:1.35; flex-basis:100%; }
  button.active { background:rgba(66,220,203,.18); border-color:rgba(66,220,203,.82); color:#eafff8; }
  button.danger { border-color:rgba(255,107,107,.6); color:#ffd2d2; }
  input { width:62px; color:var(--text); background:rgba(0,0,0,.25); border:1px solid rgba(66,180,165,.22); border-radius:9px; padding:8px 6px; }
  .readout { font-size:12px; line-height:1.25; color:#f2fbff; padding:6px 9px; min-width:158px; flex:0 0 auto; border:1px solid rgba(66,180,165,.18); border-radius:10px; background:rgba(0,0,0,.22); }
  .readout strong { color:#ffffff; font-weight:700; }
  #bottom label { white-space:nowrap; }
  .spacer { flex:1; }
  #jsonPanel { position:fixed; inset:max(52px, env(safe-area-inset-top)) 8px max(80px, env(safe-area-inset-bottom)) 8px; z-index:20; display:none; flex-direction:column; gap:8px; padding:10px; border-radius:16px; border:1px solid rgba(66,220,203,.3); background:rgba(3,5,10,.95); backdrop-filter:blur(14px); }
  #textPanel { position:fixed; left:10px; right:10px; top:50%; transform:translateY(-50%); z-index:21; display:none; flex-direction:column; gap:8px; padding:12px; border-radius:16px; border:1px solid rgba(66,220,203,.35); background:rgba(3,5,10,.96); backdrop-filter:blur(14px); box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #coordMenu { position:fixed; z-index:30; display:none; padding:6px; border-radius:14px; border:1px solid rgba(255,255,255,.18); background:rgba(5,10,22,.96); backdrop-filter:blur(14px); box-shadow:0 10px 30px rgba(0,0,0,.55); }
  #coordMenu button { min-height:34px; padding:8px 12px; white-space:nowrap; }
  #textInput { width:100%; box-sizing:border-box; color:var(--text); background:#07101c; border:1px solid rgba(66,220,203,.35); border-radius:12px; padding:12px; font-size:16px; }
  #jsonText { flex:1; width:100%; box-sizing:border-box; resize:none; color:#eafff8; background:#07101c; border:1px solid rgba(66,220,203,.35); border-radius:12px; padding:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }

  #splash {
    position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
    background:#000;
    color:#fff; transition:opacity .45s ease, visibility .45s ease; overflow:hidden;
  }
  #splash.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  #splash::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 42%, rgba(39,211,255,.12), transparent 42%),
      radial-gradient(circle at 50% 58%, rgba(255,211,0,.08), transparent 36%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 45%, rgba(0,0,0,.55) 75%, #000 100%);
    pointer-events:none;
  }
  #splash::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,0) 40%, rgba(0,0,0,.36));
    pointer-events:none;
  }
  #splashCard {
    position:relative; z-index:1; width:min(1060px, calc(100vw - 18px)); padding:16px 8px 20px;
    text-align:center; border-radius:26px; background:transparent;
    filter:drop-shadow(0 24px 38px rgba(0,0,0,.88));
  }
  #splashTitle {
    position:relative; width:min(900px, 94vw); aspect-ratio:1 / 1; margin:clamp(-110px, -8vw, -34px) auto clamp(-120px, -9vw, -42px);
    transform:translateZ(0); will-change:transform; backface-visibility:hidden;
    animation:splashStageBreathe 5.6s ease-in-out 1.8s infinite;
  }
  #splashTitle::before {
    content:""; position:absolute; inset:15% 5% 7%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(48,217,255,.24), rgba(255,213,0,.11) 42%, transparent 70%);
    filter:blur(20px); opacity:.78; animation:splashAura 4.2s ease-in-out 1.2s infinite;
  }
  .splashPiece {
    position:absolute; inset:0; width:100%; height:100%; opacity:0;
    transform:translateZ(0); will-change:transform, opacity, filter;
    filter:drop-shadow(0 18px 20px rgba(0,0,0,.72));
  }
  .splashPiece img { display:block; width:100%; height:100%; object-fit:contain; transform:translateZ(0); backface-visibility:hidden; }
  .splashOof { transform-origin:49.3% 31.6%; }
  .splashOofBracketLeft {
    transform-origin:42.6% 31.4%;
    animation:splashOofLeftBracketIn .78s cubic-bezier(.18,1.38,.28,1) .02s both;
  }
  .splashOofFirstO {
    transform-origin:47.3% 31.6%;
    animation:splashOofFirstOIn .84s cubic-bezier(.18,1.42,.28,1) .10s both;
  }
  .splashOofSecondO {
    transform-origin:52.2% 31.6%;
    animation:splashOofSecondOIn .86s cubic-bezier(.18,1.42,.28,1) .18s both;
  }
  .splashOofF {
    transform-origin:57.0% 31.2%;
    animation:splashOofFIn .80s cubic-bezier(.18,1.35,.28,1) .28s both;
  }
  .splashOofBracketRight {
    transform-origin:61.5% 31.4%;
    animation:splashOofRightBracketIn .76s cubic-bezier(.18,1.34,.28,1) .38s both;
  }
  .splashOrganized {
    transform-origin:50.5% 50.9%;
    animation:splashOrganizedIn .88s cubic-bezier(.18,1.22,.25,1) .34s both;
  }
  .splashChaos {
    transform-origin:50.6% 69.0%;
    animation:splashChaosIn .88s cubic-bezier(.18,1.22,.25,1) .62s both;
  }
  .splashEye {
    z-index:4;
    transform-origin:66.3% 68.1%;
    filter:drop-shadow(0 7px 10px rgba(0,0,0,.65));
    animation:splashEyeIn .72s cubic-bezier(.16,1.48,.24,1) 1.02s both;
  }
  .splashEyeRestart {
    position:absolute; left:60.05%; top:61.94%; width:11.57%; height:11.30%;
    z-index:7; padding:0; border:0; border-radius:50%; background:transparent;
    cursor:pointer; appearance:none; -webkit-appearance:none; touch-action:manipulation;
  }
  .splashEyeRestart:focus-visible {
    outline:3px solid rgba(255,213,0,.8); outline-offset:4px;
    box-shadow:0 0 24px rgba(39,211,255,.5);
  }
  #splash.splashOpening { pointer-events:none; }
  #splash.splashOpening #splashSub,
  #splash.splashOpening #splashBar,
  #splash.splashOpening #splashCredit { animation:splashUiFadeAway .42s ease both; }
  #splashTitle.splashOpeningPlanner { animation:none; }
  #splashTitle.splashOpeningPlanner .splashPiece img { animation:none; }
  #splashTitle.splashOpeningPlanner .splashEyeRestart { pointer-events:none; }
  #splashTitle.splashOpeningPlanner .splashOofBracketLeft { opacity:1; animation:splashOofExitLeft .78s cubic-bezier(.18,.8,.18,1) both !important; }
  #splashTitle.splashOpeningPlanner .splashOofFirstO { opacity:1; animation:splashOofExitPop .72s cubic-bezier(.18,.8,.18,1) .04s both !important; }
  #splashTitle.splashOpeningPlanner .splashOofSecondO { opacity:1; animation:splashOofExitPopAlt .76s cubic-bezier(.18,.8,.18,1) .08s both !important; }
  #splashTitle.splashOpeningPlanner .splashOofF { opacity:1; animation:splashOofExitRight .74s cubic-bezier(.18,.8,.18,1) .12s both !important; }
  #splashTitle.splashOpeningPlanner .splashOofBracketRight { opacity:1; animation:splashOofExitRightFar .80s cubic-bezier(.18,.8,.18,1) .16s both !important; }
  #splashTitle.splashOpeningPlanner .splashOrganized { opacity:1; animation:splashWordExitRight .82s cubic-bezier(.18,.8,.18,1) .10s both !important; }
  #splashTitle.splashOpeningPlanner .splashChaos { opacity:1; animation:splashWordExitLeftDown .88s cubic-bezier(.18,.8,.18,1) .16s both !important; }
  #splashTitle.splashOpeningPlanner .splashEye { opacity:1; animation:splashEyeLookThenDistance 1.58s cubic-bezier(.22,.9,.28,1) .34s both !important; }
  .splashOofBracketLeft img { animation:splashTinyFloat 4.7s ease-in-out 1.10s infinite; }
  .splashOofFirstO img { animation:splashTinyFloatAlt 4.9s ease-in-out 1.20s infinite; }
  .splashOofSecondO img { animation:splashTinyFloat 5.05s ease-in-out 1.32s infinite; }
  .splashOofF img { animation:splashTinyFloatAlt 4.85s ease-in-out 1.46s infinite; }
  .splashOofBracketRight img { animation:splashTinyFloat 5.15s ease-in-out 1.58s infinite; }
  .splashOrganized img { animation:splashTinyFloatAlt 5.1s ease-in-out 1.35s infinite; }
  .splashChaos img { animation:splashTinyFloat 5.4s ease-in-out 1.6s infinite; }
  .splashEye img { animation:splashEyeWiggle 3.4s ease-in-out 1.8s infinite; transform-origin:50% 58%; }
  @keyframes splashOofLeftBracketIn {
    0% { opacity:0; transform:translate(-10%,-42%) scale(.76) rotate(-12deg); filter:blur(5px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    62% { opacity:1; transform:translate(1.2%,5.4%) scale(1.08) rotate(2.2deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    82% { transform:translate(-.4%,-1.8%) scale(.985) rotate(-.8deg); }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashOofFirstOIn {
    0% { opacity:0; transform:translate(-5%,-48%) scale(.72) rotate(-8deg); filter:blur(5px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    58% { opacity:1; transform:translate(.7%,6.2%) scale(1.10) rotate(2.8deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    80% { transform:translate(-.2%,-2.1%) scale(.982) rotate(-.9deg); }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashOofSecondOIn {
    0% { opacity:0; transform:translate(4%,-46%) scale(.74) rotate(8deg); filter:blur(5px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    60% { opacity:1; transform:translate(-.7%,5.8%) scale(1.09) rotate(-2.4deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    81% { transform:translate(.25%,-2%) scale(.984) rotate(.85deg); }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashOofFIn {
    0% { opacity:0; transform:translate(8%,-41%) scale(.78) rotate(10deg); filter:blur(5px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    63% { opacity:1; transform:translate(-1%,4.8%) scale(1.07) rotate(-2deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    82% { transform:translate(.35%,-1.6%) scale(.987) rotate(.7deg); }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashOofRightBracketIn {
    0% { opacity:0; transform:translate(12%,-36%) scale(.80) rotate(13deg); filter:blur(5px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    64% { opacity:1; transform:translate(-1.2%,4.5%) scale(1.06) rotate(-2.2deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    83% { transform:translate(.45%,-1.4%) scale(.989) rotate(.7deg); }
    100% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashOrganizedIn {
    0% { opacity:0; transform:translateX(-15%) scale(.92) rotate(-1deg); filter:blur(4px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    72% { opacity:1; transform:translateX(1.4%) scale(1.025) rotate(.35deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    100% { opacity:1; transform:translateX(0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashChaosIn {
    0% { opacity:0; transform:translateX(15%) scale(.92) rotate(1.3deg); filter:blur(4px) drop-shadow(0 18px 20px rgba(0,0,0,.2)); }
    72% { opacity:1; transform:translateX(-1.2%) scale(1.025) rotate(-.35deg); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    100% { opacity:1; transform:translateX(0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
  }
  @keyframes splashEyeIn {
    0% { opacity:0; transform:scale(.1) rotate(-70deg); filter:blur(3px) drop-shadow(0 7px 10px rgba(0,0,0,.2)); }
    62% { opacity:1; transform:scale(1.28) rotate(12deg); filter:blur(0) drop-shadow(0 7px 10px rgba(0,0,0,.65)); }
    82% { transform:scale(.92) rotate(-5deg); }
    100% { opacity:1; transform:scale(1) rotate(0); filter:blur(0) drop-shadow(0 7px 10px rgba(0,0,0,.65)); }
  }
  @keyframes splashStageBreathe {
    0%,100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-7px) scale(1.01); }
  }
  @keyframes splashTinyFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-5px); }
  }
  @keyframes splashTinyFloatAlt {
    0%,100% { transform:translateY(0) rotate(0); }
    50% { transform:translateY(-4px) rotate(.18deg); }
  }
  @keyframes splashEyeWiggle {
    0%,100% { transform:translate(0,0) rotate(0) scale(1); }
    22% { transform:translate(.7px,-.5px) rotate(3.4deg) scale(1.012); }
    45% { transform:translate(-.5px,.45px) rotate(-2.4deg) scale(.998); }
    70% { transform:translate(.35px,0) rotate(1.5deg) scale(1.006); }
  }
  @keyframes splashAura {
    0%,100% { opacity:.58; transform:scale(.96); }
    50% { opacity:1; transform:scale(1.06); }
  }
  @keyframes splashUiFadeAway {
    to { opacity:0; transform:translateY(8px); filter:blur(3px); }
  }
  @keyframes splashOofExitLeft {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    48% { opacity:1; transform:translate(-8%,-6%) scale(1.24) rotate(-8deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(-62%,-44%) scale(1.72) rotate(-18deg); filter:blur(7px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashOofExitPop {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    45% { opacity:1; transform:translate(-2%,-7%) scale(1.30) rotate(-3deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(-24%,-56%) scale(1.82) rotate(-10deg); filter:blur(7px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashOofExitPopAlt {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    46% { opacity:1; transform:translate(3%,-6%) scale(1.32) rotate(4deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(18%,-58%) scale(1.86) rotate(12deg); filter:blur(7px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashOofExitRight {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    48% { opacity:1; transform:translate(8%,-5%) scale(1.25) rotate(6deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(46%,-46%) scale(1.76) rotate(18deg); filter:blur(7px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashOofExitRightFar {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    48% { opacity:1; transform:translate(10%,-4%) scale(1.22) rotate(9deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(66%,-42%) scale(1.70) rotate(22deg); filter:blur(7px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashWordExitRight {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    50% { opacity:1; transform:translate(10%,-1%) scale(1.16) rotate(2deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(72%,-3%) scale(1.62) rotate(7deg); filter:blur(8px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashWordExitLeftDown {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 18px 20px rgba(0,0,0,.72)); }
    50% { opacity:1; transform:translate(-9%,4%) scale(1.14) rotate(-2deg); filter:blur(.5px) drop-shadow(0 22px 24px rgba(0,0,0,.76)); }
    100% { opacity:0; transform:translate(-66%,40%) scale(1.56) rotate(-8deg); filter:blur(8px) drop-shadow(0 26px 26px rgba(0,0,0,.45)); }
  }
  @keyframes splashEyeLookThenDistance {
    0% { opacity:1; transform:translate(0,0) scale(1) rotate(0); filter:blur(0) drop-shadow(0 7px 10px rgba(0,0,0,.65)); }
    18% { opacity:1; transform:translate(-2.6%,.6%) scale(1.06) rotate(-8deg); filter:blur(0) drop-shadow(0 8px 12px rgba(0,0,0,.70)); }

      if (!t) { editingTextId = null; hint.textContent='That text label no longer exists.'; return; }
      if (t.locked) { hint.textContent='Locked text. Unlock it before editing.'; return; }
      if (!t.coord) {
        if (!value) { hint.textContent='Type something first.'; return; }
        t.text = value;
        pendingText = value;
      }
      t.size = selectedSize;
      pendingTextSize = selectedSize;
      editingTextId = null;
      if (textInput) textInput.disabled = false;
      textPanel.style.display='none';
      mode='pan';
      saveLocal();
      updateStyleButtons();
      updateLockButton();
      hint.textContent='Text updated. You can drag it to move it or tap Text to place another label.';
      draw();
      return;
    }
    if (!value) { hint.textContent='Type something first.'; return; }
    pendingText = value;
    pendingTextSize = selectedSize;
    textPanel.style.display='none';
    mode='text';
    closeToolMenus();
    updateStyleButtons();
    hint.textContent=`Text ready at ${pendingTextSize.toFixed(1)}×. Tap the map to place it.`;
    draw();
  };
  if (textSizeRange) textSizeRange.oninput=()=>setTextSizeControl(textSizeRange.value);
  document.getElementById('coordMenuBtn').onclick=()=>placeCoordTextFromMenu();
  document.getElementById('cancelTextBtn').onclick=()=>{
    editingTextId = null;
    if (textInput) textInput.disabled = false;
    textPanel.style.display='none';
    if (mode==='text') setMode('pan');
  };


  window.addEventListener('keydown', e => {
    if (e.key === 'Shift') modifierKeys.shift = true;
    if (e.key === 'Control') modifierKeys.ctrl = true;
    if (e.key === 'Meta') modifierKeys.meta = true;

    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undoLast();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      copySelection();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
      e.preventDefault();
      pasteSelection();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      selectedItems = [];
      rects.forEach((_, index) => selectedItems.push({kind:'rect', index}));
      icons.forEach((_, index) => selectedItems.push({kind:'icon', index}));
      texts.forEach((_, index) => selectedItems.push({kind:'text', index}));
      selected = selectedItems[selectedItems.length-1] || null; updateLockButton();
      hint.textContent = `Selected ${selectedItems.length} items.`;
      draw();
    } else if (e.key === 'Escape') {
      selectedItems = [];
      selected = null; updateLockButton();
      hideCoordMenu();
      draw();
    } else if (e.key.toLowerCase() === 'l' && selectedItems.length) {
      e.preventDefault();
      toggleSelectedLock();
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedItems.length) {
      e.preventDefault();
      deleteSelectedItems();
    }
  });


  window.addEventListener('keyup', e => {
    if (e.key === 'Shift') modifierKeys.shift = false;
    if (e.key === 'Control') modifierKeys.ctrl = false;
    if (e.key === 'Meta') modifierKeys.meta = false;
  });



  function hideSplash() {
    const splash = document.getElementById('splash');
    if (splash) splash.classList.add('hidden');
  }

  const splashLogoVideo = document.getElementById('splashLogo');
  if (splashLogoVideo && splashLogoVideo.tagName === 'VIDEO') {
    const tryPlaySplash = () => splashLogoVideo.play().catch(() => {});
    splashLogoVideo.muted = true;
    splashLogoVideo.playsInline = true;
    tryPlaySplash();
    window.addEventListener('pointerdown', tryPlaySplash, { once:true });
  }
  let splashOpening = false;
  function openPlannerFromEye() {
    if (splashOpening) return;
    splashOpening = true;

    const splash = document.getElementById('splash');
    const title = document.getElementById('splashTitle');
    const eyeEnter = document.getElementById('splashEyeRestart');

    if (eyeEnter) eyeEnter.disabled = true;
    if (splash) splash.classList.add('splashOpening');
    if (title) title.classList.add('splashOpeningPlanner');

    window.setTimeout(hideSplash, 1900);
  }

  const splashEyeEnter = document.getElementById('splashEyeRestart');
  if (splashEyeEnter) {
    splashEyeEnter.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      openPlannerFromEye();
    });
    window.setTimeout(() => splashEyeEnter.focus(), 250);
  }

  window.addEventListener('keydown', e => {
    const eyeEnter = e.target.closest && e.target.closest('#splashEyeRestart');
    if (eyeEnter && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openPlannerFromEye();
    }
  });
  // No auto-dismiss: the splash remains visible until the eye is clicked.
  loadToolbarPreference();

  bg.onload=()=>{ pattern=ctx.createPattern(bg,'repeat'); updateStyleButtons(); resize(); loadLocal(); updateObjectActions(); centerOnCell(500,500); };
  window.addEventListener('resize', () => { resize(); positionMoreMenu(); updateObjectActions(); });
  resize();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
